<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Taco Miami | Owner & Finance Hub</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>

  <style>
    :root {
      --bg:#f5f7fb;
      --card:#fff;
      --ink:#172033;
      --muted:#687386;
      --line:#e4e8f0;
      --nav:#0f172a;
      --green:#17864b;
      --green2:#eaf8f0;
      --red:#c93c3c;
      --red2:#fff0f0;
      --blue:#246bfd;
      --shadow:0 8px 24px rgba(15,23,42,.07)
    }

    * { box-sizing:border-box }

    body {
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
    }

    button,input,select { font:inherit }

    .top {
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      padding:22px 18px
    }

    .top-inner {
      max-width:1180px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px
    }

    .brand h1 {
      font-size:22px;
      margin:0 0 4px
    }

    .brand p {
      margin:0;
      color:#cbd5e1;
      font-size:13px
    }

    .badge {
      background:#ffffff18;
      border:1px solid #ffffff24;
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      white-space:nowrap
    }

    .nav {
      background:#fff;
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:10;
      overflow:auto
    }

    .nav-inner {
      max-width:1180px;
      margin:auto;
      display:flex;
      gap:4px;
      padding:8px 12px
    }

    .tab {
      border:0;
      background:transparent;
      color:var(--muted);
      font-weight:750;
      padding:11px 14px;
      border-radius:10px;
      cursor:pointer;
      white-space:nowrap
    }

    .tab.active {
      background:#eaf0ff;
      color:var(--blue)
    }

    main {
      max-width:1180px;
      margin:22px auto;
      padding:0 14px 50px
    }

    .page { display:none }
    .page.active { display:block }

    .page-title {
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:12px;
      margin:0 0 15px
    }

    .page-title h2 {
      font-size:21px;
      margin:0
    }

    .page-title p {
      margin:4px 0 0;
      color:var(--muted);
      font-size:13px
    }

    .grid {
      display:grid;
      gap:14px
    }

    .summary {
      grid-template-columns:repeat(5,minmax(0,1fr))
    }

    .connections {
      grid-template-columns:repeat(2,minmax(0,1fr));
      margin-bottom:14px
    }

    .two {
      grid-template-columns:1fr 1.6fr
    }

    .property-grid {
      grid-template-columns:repeat(3,minmax(0,1fr))
    }

    .card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      box-shadow:var(--shadow)
    }

    .metric .label {
      color:var(--muted);
      font-size:12px;
      font-weight:700
    }

    .metric .value {
      font-size:24px;
      font-weight:850;
      margin-top:7px
    }

    .metric small {
      display:block;
      margin-top:5px;
      color:var(--muted)
    }

    .green { color:var(--green) }
    .red { color:var(--red) }

    .connect-card {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px
    }

    .connect-card h3 {
      margin:0 0 4px;
      font-size:16px
    }

    .connect-card p {
      margin:0;
      color:var(--muted);
      font-size:12px
    }

    .status {
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      font-weight:800;
      margin-top:8px
    }

    .dot {
      width:8px;
      height:8px;
      border-radius:50%;
      background:#94a3b8
    }

    .status.ok { color:var(--green) }
    .status.ok .dot { background:var(--green) }

    .btn {
      border:0;
      border-radius:10px;
      padding:10px 13px;
      font-weight:800;
      cursor:pointer
    }

    .btn-primary {
      background:var(--blue);
      color:white
    }

    .btn-green {
      background:var(--green);
      color:white
    }

    .btn-dark {
      background:var(--nav);
      color:white
    }

    .btn-light {
      background:#edf1f7;
      color:#334155
    }

    .btn-red {
      background:var(--red2);
      color:var(--red)
    }

    .btn:disabled {
      opacity:.55;
      cursor:not-allowed
    }

    .section-title {
      font-size:16px;
      margin:0 0 12px
    }

    .form-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:11px
    }

    .field {
      display:flex;
      flex-direction:column;
      gap:6px
    }

    .field.full { grid-column:1/-1 }

    .field label {
      font-size:12px;
      color:var(--muted);
      font-weight:750
    }

    .field input,
    .field select {
      width:100%;
      border:1px solid #d7dce6;
      background:white;
      color:var(--ink);
      border-radius:10px;
      padding:11px;
      outline:none
    }

    .table-wrap {
      overflow:auto;
      border:1px solid var(--line);
      border-radius:12px
    }

    table {
      width:100%;
      border-collapse:collapse;
      min-width:760px
    }

    th,td {
      text-align:left;
      padding:11px 12px;
      border-bottom:1px solid var(--line);
      font-size:12px
    }

    th {
      background:#f8fafc;
      color:#5f6b7c;
      font-size:11px;
      text-transform:uppercase
    }

    tr:last-child td { border-bottom:0 }

    .pill {
      display:inline-block;
      border-radius:999px;
      padding:4px 8px;
      font-weight:800
    }

    .pill.income {
      background:var(--green2);
      color:var(--green)
    }

    .pill.expense {
      background:var(--red2);
      color:var(--red)
    }

    .empty {
      text-align:center;
      color:var(--muted);
      padding:30px!important
    }

    .delete {
      border:0;
      background:transparent;
      color:var(--red);
      font-weight:800;
      cursor:pointer
    }

    .filters {
      display:flex;
      gap:9px;
      flex-wrap:wrap;
      margin-bottom:12px
    }

    .filters input,
    .filters select {
      border:1px solid var(--line);
      background:white;
      border-radius:10px;
      padding:9px 10px
    }

    .property-card h3 {
      margin:0;
      font-size:15px
    }

    .property-card .amount {
      font-size:23px;
      font-weight:850;
      margin:10px 0 4px
    }

    .property-card small { color:var(--muted) }

    .tax-box {
      background:linear-gradient(135deg,#132238,#1f3b58);
      color:white
    }

    .tax-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px
    }

    .tax-box .label {
      color:#cbd5e1;
      font-size:12px
    }

    .tax-box .value {
      font-size:25px;
      font-weight:850;
      margin-top:5px
    }

    .tax-box .pending { color:#ffd166 }

    .fixed-row {
      display:flex;
      justify-content:space-between;
      padding:10px 0;
      border-bottom:1px solid var(--line)
    }

    .notice {
      border-radius:12px;
      padding:12px 14px;
      font-size:13px;
      margin-bottom:14px;
      display:none
    }

    .notice.show { display:block }

    .notice.ok {
      background:var(--green2);
      color:#0d6b3a
    }

    .notice.err {
      background:var(--red2);
      color:#a22b2b
    }

    .actions {
      display:flex;
      gap:9px;
      flex-wrap:wrap
    }

    .footer {
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin-top:28px
    }

    @media(max-width:900px) {
      .summary { grid-template-columns:repeat(2,1fr) }
      .connections,.two { grid-template-columns:1fr }
      .property-grid { grid-template-columns:repeat(2,1fr) }
    }

    @media(max-width:560px) {
      .badge { display:none }
      .summary,.property-grid { grid-template-columns:1fr 1fr }
      .form-grid { grid-template-columns:1fr }
      .field.full { grid-column:auto }
      .tax-grid { grid-template-columns:1fr }
      .connect-card {
        align-items:flex-start;
        flex-direction:column
      }
      .metric .value { font-size:21px }
      .card { padding:14px }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>🌮 Taco Miami Taqueria</h1>
        <p>Owner & Finance Hub</p>
      </div>
      <div class="badge">Acceso privado de propietarios</div>
    </div>
  </header>

  <nav class="nav">
    <div class="nav-inner">
      <button class="tab active" data-page="resumen">Resumen</button>
      <button class="tab" data-page="movimientos">Movimientos</button>
      <button class="tab" data-page="propiedades">Propiedades</button>
      <button class="tab" data-page="tax">Sales Tax</button>
      <button class="tab" data-page="reportes">Reportes</button>
    </div>
  </nav>

  <main>
    <div id="notice" class="notice"></div>

    <section id="resumen" class="page active">
      <div class="page-title">
        <div>
          <h2>Resumen financiero</h2>
          <p>Vista consolidada de Shell y Food Truck Original</p>
        </div>
      </div>
